services:
  web:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${PORT:-8080}:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15
